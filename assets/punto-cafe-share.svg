  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1130" cy="-40" r="250" fill="#d98b7a" opacity=".22"/>
  <circle cx="40" cy="650" r="250" fill="#d98b7a" opacity=".14"/>

  <g transform="translate(70 62)">
