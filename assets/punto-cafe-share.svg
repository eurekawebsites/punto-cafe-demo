    <text x="314" y="379" text-anchor="middle" fill="#78676b" font-family="DejaVu Sans, sans-serif" font-size="12">TOTAL</text>
    <text x="314" y="406" text-anchor="middle" fill="#6e2637" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="900">$150</text>
