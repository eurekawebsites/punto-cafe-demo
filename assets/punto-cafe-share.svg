    <text x="128" y="43" fill="#f2c9c0" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" letter-spacing="3">PEDIDOS EN LÍNEA</text>
    <text x="128" y="82" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="800">Punto Café Lite</text>
  </g>

  <text x="70" y="250" fill="#ffffff" font-family="Georgia, serif" font-size="68" font-weight="700">Tu canal propio</text>
