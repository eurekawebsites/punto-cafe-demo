      <text x="95" y="37" fill="#4d1826" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="800">Cold Brew</text>
      <text x="14" y="99" fill="#6e2637" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="800">$72</text>
